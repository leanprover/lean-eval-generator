name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # leanprover/lean-action pinned to v1.5.0.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: true

      - name: Build generator
        run: lake build

      - name: Check versioned JSON contract
        run: python3 tests/scripts/contract.py

      - name: Check quoted module and declaration paths
        run: lake build test_module_paths && lake env .lake/build/bin/test_module_paths

      - name: Check Python test harnesses
        run: python3 -m py_compile tests/scripts/*.py
